<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Order in the Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Space+Mono:wght@700&display=swap">
<style>
/* Layout: a kitchen pass. Order tickets pinned along the rail at the top, the letter hob below, the serve counter at the bottom. */
:root{
  --bg:#dff1ee; --tile:#c9e7e2; --counter:#ffffff; --ink:#1d3b3a; --muted:#527572;
  --ticket:#fff6d6; --ticket-line:#e9d68f; --hot:#e4572e; --fresh:#2a9d6f; --warn:#f2a541;
  --plate:#ffffff; --plate-edge:#a9cfc9; --sel:#e4572e; --line:#b8dad4;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Space Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f2524; --tile:#163332; --counter:#1b3b39; --ink:#e6f5f2; --muted:#93b8b3;
  --ticket:#3a341c; --ticket-line:#6b5e2a; --hot:#ff7a52; --fresh:#4fd39b; --warn:#ffc061;
  --plate:#24504d; --plate-edge:#357069; --sel:#ff7a52; --line:#2b5552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f2524; --tile:#163332; --counter:#1b3b39; --ink:#e6f5f2; --muted:#93b8b3;
  --ticket:#3a341c; --ticket-line:#6b5e2a; --hot:#ff7a52; --fresh:#4fd39b; --warn:#ffc061;
  --plate:#24504d; --plate-edge:#357069; --sel:#ff7a52; --line:#2b5552; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);background-size:44px 44px}
.wrap{max-width:620px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
.card{background:var(--counter);border:2px solid var(--line);border-radius:18px;padding:20px}
.btn{font-family:var(--f-display);font-weight:700;font-size:18px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:var(--hot);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--plate);color:var(--ink);border:2px solid var(--plate-edge)}
.btn.small{font-size:15px;padding:8px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* intro */
.intro h1{font-size:clamp(40px,10vw,64px);font-weight:800;color:var(--hot);letter-spacing:-.01em}
.intro .sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.how div{background:var(--bg);border-radius:12px;padding:12px;font-size:14px}
.how b{display:block;font-family:var(--f-display);font-size:17px}
@media (max-width:520px){.how{grid-template-columns:1fr}}
.paperpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pp{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--plate-edge);background:var(--plate);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.pp[aria-pressed="true"]{background:var(--ink);color:var(--counter);border-color:var(--ink)}
/* hud */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700}
.hud .big{font-size:26px;font-variant-numeric:tabular-nums}
.hud .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;line-height:1}
.stars{font-size:22px;letter-spacing:2px;color:var(--line)}
.stars .on{color:var(--warn)}
/* tickets */
.rail{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px;min-height:148px}
@media (max-width:520px){.rail{grid-template-columns:1fr;min-height:0;gap:6px}.ticket{padding:7px 10px 9px;gap:3px}.ticket.empty{padding:6px}.ticket .bar{height:5px}.hud .big{font-size:22px}.hud.card{padding:8px 14px!important}}
.ticket{background:var(--ticket);border:2px dashed var(--ticket-line);border-radius:6px 6px 14px 14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0;animation:drop .35s ease}
.ticket.empty{background:transparent;border-style:dotted;border-color:var(--line);color:var(--muted);align-items:center;justify-content:center;font-size:13px;animation:none}
.ticket .top{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ticket .clue{font-size:14.5px;min-width:0;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.ticket .len{font-family:var(--f-mono);font-size:13px;color:var(--hot)}
.ticket .bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:auto}
.ticket .bar i{display:block;height:100%;background:var(--fresh)}
.ticket.mid .bar i{background:var(--warn)} .ticket.late .bar i{background:var(--hot)}
.ticket.late{animation:wobble .6s ease-in-out infinite}
.lenrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ticket .peek{font:inherit;font-size:12px;font-weight:800;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;align-self:flex-start;text-decoration:underline}
@keyframes drop{from{transform:translateY(-14px);opacity:.3}to{transform:none;opacity:1}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
/* hob */
.hob{background:var(--counter);border:2px solid var(--line);border-radius:20px;padding:12px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;position:relative;z-index:1}
.cell{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--plate);border:3px solid var(--plate-edge);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6vw,30px);color:var(--ink);cursor:pointer;transition:transform .12s, background .12s;padding:0}
.cell.sel{background:var(--sel);border-color:var(--sel);color:#fff;transform:scale(1.06)}
.cell.last{box-shadow:0 0 0 4px color-mix(in srgb,var(--sel) 35%,transparent)}
.cell.fresh{animation:fresh .45s ease}
.cell.hint{border-color:var(--warn);border-style:dashed}
@keyframes fresh{0%{transform:scale(.4) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
svg.trail{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);pointer-events:none;z-index:0}
.pass{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.word{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.08em;min-height:40px;color:var(--hot);min-width:0;overflow-wrap:anywhere}
.word.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;top:46%;transform:translateX(-50%);background:var(--ink);color:var(--counter);font-family:var(--f-display);font-weight:700;font-size:18px;padding:8px 18px;border-radius:999px;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.ticket,.ticket.late,.cell.fresh,.word.shake{animation:none}}
/* results */
.res h2{font-size:40px;color:var(--hot)}
.bigstars{font-size:54px;letter-spacing:6px;color:var(--line);line-height:1;margin:10px 0}
.bigstars .on{color:var(--warn)}
.rail.mcq{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));min-height:0}
.rail.mcq .ticket{cursor:pointer;padding:8px 10px 10px;gap:4px}
.rail.mcq .ticket .clue{font-size:13.5px;line-height:1.3}
.rail.mcq .ticket.cur{border-style:solid;border-color:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 25%,transparent)}
.rail.mcq .ticket:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.counter{display:flex;flex-direction:column;gap:12px}
.counter .tagline{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--hot)}
.counter .stem{font-size:16.5px;line-height:1.55;margin:0;max-width:65ch}
.mopts{display:flex;flex-direction:column;gap:8px}
.mopt{font:inherit;font-size:15px;text-align:left;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--plate);color:var(--ink);border:2px solid var(--plate-edge);border-radius:12px;padding:10px 12px;cursor:pointer}
.mopt:hover:not(:disabled){border-color:var(--hot)}
.mopt .k{font-family:var(--f-display);font-weight:800;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tile)}
.mopt span:last-child{min-width:0;padding-top:2px}
.mopt:disabled{cursor:default;opacity:.35}
.mopt.right{border-color:var(--fresh);opacity:1}.mopt.right .k{background:var(--fresh);color:#fff}
.mopt.wrong{border-color:var(--hot);opacity:1}.mopt.wrong .k{background:var(--hot);color:#fff}
.fb{border:2px solid var(--hot);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb h3{color:var(--hot);font-size:22px}
.fb p{margin:0;max-width:65ch}
.lifeline{font:inherit;font-size:13px;font-weight:800;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline;align-self:flex-start}
.menu .ans{color:var(--fresh);font-weight:700}
.menu .yours{color:var(--hot)}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menu div{border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.menu b{font-family:var(--f-display);font-size:17px;letter-spacing:.04em}
.menu .burnt b{color:var(--hot);text-decoration:line-through}
.muted{color:var(--muted)}
.lbl2{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <!-- INTRO -->
  <section id="intro" class="card intro">
    <div class="sub">An FLK kitchen rush for Angelica</div>
    <h1>Order in the Kitchen</h1>
    <p style="margin:8px 0 0;max-width:56ch" id="introLine"></p>
    <div class="how" id="how"></div>
    <div class="paperpick" id="modePick" aria-label="Game mode"></div>
    <div class="paperpick" id="paperPick" aria-label="Paper"></div>
    <div class="paperpick" id="speedPick" aria-label="Speed"></div>
    <p class="muted" id="speedLine" style="margin:-6px 0 16px;font-size:14px"></p>
    <div class="row">
      <button class="btn" id="startBtn">Start the shift</button>
      <button class="btn alt small" id="soundBtn" aria-pressed="true">Sound: on</button>
    </div>
    <p class="muted" id="bestLine" style="margin:12px 0 0;font-size:14px"></p>
  </section>

  <!-- GAME -->
  <section id="game" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="hud card" style="padding:12px 16px">
        <div><span class="lbl">Tips</span><span class="big" id="tips">£0</span></div>
        <div><span class="lbl">Combo</span><span class="big" id="combo">×1</span></div>
        <div class="stars" id="hudStars" aria-label="Stars"><span>★</span><span>★</span><span>★</span></div>
        <div><span class="lbl">Shift</span><span class="big" id="clock">3:00</span></div>
      </div>
      <div class="rail" id="rail"></div>
      <div class="counter card" id="counter" hidden></div>
      <div class="hob" id="hob">
        <svg class="trail" id="trail" aria-hidden="true"></svg>
        <div class="grid" id="grid"></div>
      </div>
      <div class="pass card" id="pass" style="padding:12px 16px">
        <div class="word" id="word" aria-live="polite"></div>
        <div class="row">
          <button class="btn alt small" id="binBtn">Bin it</button>
          <button class="btn small" id="serveBtn">Serve</button>
        </div>
      </div>
      <div class="row" style="justify-content:center"><button class="btn alt small" id="endBtn">Close the kitchen early</button></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="card res" hidden>
    <div class="lbl2" style="margin:0">Shift over</div>
    <h2 id="resHead">Service!</h2>
    <div class="bigstars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
    <p id="resLine" style="margin:0;font-size:18px;font-weight:700"></p>
    <p class="muted" id="resSub" style="margin:4px 0 16px"></p>
    <div class="row"><button class="btn" id="againBtn">Next shift</button><button class="btn alt" id="homeBtn">Back to the menu</button></div>
    <p class="lbl2" id="menuHead">Tonight's menu (revise these)</p>
    <div class="menu" id="menu"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="questions.js"></script>
<script>
const WORDS = [
 ["RATIO","Ratio","The binding part of a judgment","FLK1"],
 ["OBITER","Obiter","Said 'by the way' in a judgment, so only persuasive","FLK1"],
 ["TORT","Tort","A civil wrong other than a breach of contract","FLK1"],
 ["OFFER","Offer","Once accepted, it forms a contract","FLK1"],
 ["ESTOPPEL","Estoppel","Promissory ___ can stop a creditor going back on a promise","FLK1"],
 ["DAMAGES","Damages","The usual money remedy for a breach of contract","FLK1"],
 ["VOLENTI","Volenti","___ non fit injuria: the consent defence in tort","FLK1"],
 ["NUISANCE","Nuisance","Unreasonable interference with someone's use of their land","FLK1"],
 ["HANSARD","Hansard","Parliament's record, usable after Pepper v Hart","FLK1"],
 ["STATUTE","Statute","Another name for an Act of Parliament","FLK1"],
 ["DIRECTOR","Director","Owes the general duties in ss171 to 177 CA 2006","FLK1"],
 ["DIVIDEND","Dividend","Paid to shareholders out of distributable profits","FLK1"],
 ["PARTNER","Partner","Shares profits equally by default under s24 PA 1890","FLK1"],
 ["CLAIMANT","Claimant","The party who issues the claim form","FLK1"],
 ["DEFENCE","Defence","Due 14 days after the particulars, or 28 with an acknowledgment of service","FLK1"],
 ["CONFLICT","Conflict","Para 6.2 SRA Code: ___ of interest","FLK1"],
 ["VICARIOUS","Vicarious","___ liability: the employer pays for the employee's tort","FLK1"],
 ["DUTY","Duty","___ of care: the first element of negligence","FLK1"],
 ["PRECEDENT","Precedent","Stare decisis is the doctrine of binding ___","FLK1"],
 ["JUDICIAL","Judicial","___ review: challenging a public body's decision","FLK1"],
 ["EASEMENT","Easement","A right of way is the classic example","FLK2"],
 ["COVENANT","Covenant","A promise in a deed, such as not to build on land","FLK2"],
 ["LEASE","Lease","Creates a term of years absolute","FLK2"],
 ["MORTGAGE","Mortgage","Security over land for a loan","FLK2"],
 ["DEPOSIT","Deposit","Usually 10% of the price, paid on exchange","FLK2"],
 ["FREEHOLD","Freehold","The fee simple absolute in possession","FLK2"],
 ["SEVERANCE","Severance","Turns a beneficial joint tenancy into a tenancy in common","FLK2"],
 ["TRUSTEE","Trustee","Holds legal title for the beneficiaries","FLK2"],
 ["SETTLOR","Settlor","The person who creates a trust","FLK2"],
 ["CODICIL","Codicil","A document that amends a will","FLK2"],
 ["PROBATE","Probate","The grant made to executors","FLK2"],
 ["EXECUTOR","Executor","Named in a will to administer the estate","FLK2"],
 ["INTESTACY","Intestacy","Dying without a valid will","FLK2"],
 ["LEGACY","Legacy","A gift of money in a will","FLK2"],
 ["CHATTEL","Chattel","A movable item of personal property","FLK2"],
 ["LEDGER","Ledger","Client ___: the record of each client's money","FLK2"],
 ["BILL","Bill","Must be given before a firm can take its fees from client account","FLK2"],
 ["BAIL","Bail","There's a general right to it under s4 of the 1976 Act","FLK2"],
 ["THEFT","Theft","Dishonest appropriation of property belonging to another","FLK2"],
 ["BURGLARY","Burglary","Entering a building as a trespasser with intent (s9)","FLK2"],
 ["MENSREA","Mens rea","The guilty mind","FLK2"],
 ["ACTUSREUS","Actus reus","The guilty act","FLK2"],
 ["CAUTION","Caution","'You do not have to say anything...'","FLK2"],
 ["TURNBULL","Turnbull","The direction on disputed identification evidence","FLK2"],
 ["MURDER","Murder","Mens rea: intention to kill or cause GBH","FLK2"],
];
const N=6;
let MAXORD=2;
const SPEEDS={
  relaxed:{label:"Relaxed",max:2,mcq:{life:200,shift:480},grid:{mult:2,shift:300},note:"Two orders at a time with plenty of time to read. About 1 min 40 s per question."},
  exam:{label:"Exam pace",max:2,mcq:{life:160,shift:480},grid:{mult:1.5,shift:240},note:"Two orders at a time. About 1 min 20 s per question, the same as the exam."},
  rush:{label:"Rush",max:3,mcq:{life:110,shift:300},grid:{mult:1,shift:180},note:"Three orders at once. Faster than the exam, for when you know it well."}
};
const SP=()=>SPEEDS[speed];
let SHIFT=180;
const BANK=window.FLK_BANK||[];
const FILL="EEEEEEEAAAAARRRRIIIIOOOOTTTTNNNNSSSSLLLCCCUUDDDPPMMHHGBBFYWKV";
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let speed=store.get("ok-speed","relaxed");if(!SPEEDS[speed])speed="relaxed";

/* ---------- sound ---------- */
let soundOn=store.get("ok-sound",true), ac=null;
function beep(f,d=.08,type="sine",vol=.06){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(ac.destination);const t=ac.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={tap:n=>beep(420+n*40,.06,"triangle"),serve:()=>{beep(660,.1);setTimeout(()=>beep(880,.14),90);setTimeout(()=>beep(1180,.18),180)},bad:()=>beep(160,.18,"square",.04),burn:()=>{beep(220,.25,"sawtooth",.04)},ding:()=>beep(1320,.12)};

/* ---------- intro ---------- */
let paper="Both", mode=store.get("ok-mode","mcq");
const HOW={
  mcq:["The chambers canteen is slammed, and every order is an SQE1-style question. Pick the single best answer before the table loses patience.",
    [["1. Pick a ticket","Each one is an FLK question. Tap a ticket to work on it."],["2. Choose the best answer","Five options, A to E, just like the exam. One is best."],["3. Serve it hot","Fast, correct serves earn bigger tips. Wrong answers get sent back."]]],
  grid:["The chambers canteen is slammed, and every order is a legal term. Read the ticket, find the word in the letter grid, and serve it before it burns.",
    [["1. Read the ticket","Each one is an FLK clue with the number of letters."],["2. Trace the letters","Drag or tap neighbouring plates, diagonals included. Each plate can only be used once per word."],["3. Serve it hot","Fast serves earn bigger tips. Burnt orders cost you."]]]
};
const bestKey=()=>mode==="grid"?"ok-best":"ok-best-mcq";
function renderIntro(){
  const mp=$("modePick");mp.innerHTML="";
  [["mcq","Best answer (exam style)"],["grid","Letter grid"]].forEach(([m,t])=>{const b=document.createElement("button");b.className="pp";b.textContent=t;b.setAttribute("aria-pressed",mode===m);b.onclick=()=>{mode=m;store.set("ok-mode",m);renderIntro()};mp.append(b)});
  $("introLine").textContent=HOW[mode][0];
  $("how").innerHTML=HOW[mode][1].map(([a,b])=>`<div><b>${a}</b>${b}</div>`).join("");
  $("startBtn").textContent=`Start the ${Math.round(SP()[mode].shift/60)}-minute shift`;
  const sp=$("speedPick");sp.innerHTML="";
  Object.entries(SPEEDS).forEach(([k,v])=>{const b=document.createElement("button");b.className="pp";b.textContent=v.label;b.setAttribute("aria-pressed",speed===k);b.onclick=()=>{speed=k;store.set("ok-speed",k);renderIntro()};sp.append(b)});
  $("speedLine").textContent=mode==="mcq"?SP().note:{relaxed:"Two orders at a time, with double the time on each ticket.",exam:"Two orders at a time, with extra time on each ticket.",rush:"Three orders at once. The original speed."}[speed];
  const pp=$("paperPick");pp.innerHTML="";
  [["FLK1","FLK1"],["FLK2","FLK2"],["Both","Both papers"]].forEach(([p,t])=>{const b=document.createElement("button");b.className="pp";b.textContent=t;b.setAttribute("aria-pressed",paper===p);b.onclick=()=>{paper=p;renderIntro()};pp.append(b)});
  const best=store.get(bestKey(),0);const T=TH[mode];
  $("bestLine").textContent=(best?`Best shift so far: £${best} in tips. `:"")+`Star targets: £${T[0]}, £${T[1]} and £${T[2].toLocaleString("en-GB")} in tips.`;
  $("soundBtn").textContent="Sound: "+(soundOn?"on":"off");$("soundBtn").setAttribute("aria-pressed",soundOn);
}
$("soundBtn").onclick=()=>{soundOn=!soundOn;store.set("ok-sound",soundOn);renderIntro()};

/* ---------- grid model ---------- */
let grid, owners, orders, G, raf, last;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nbrs=i=>{const r=Math.floor(i/N),c=i%N,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const R=r+dr,C=c+dc;if(R>=0&&R<N&&C>=0&&C<N)o.push(R*N+C)}return o};
const adj=(a,b)=>nbrs(a).includes(b);
function placePath(word){
  const usable=(i,ch)=>owners[i].size===0||grid[i]===ch;
  let tries=0;
  function dfs(path){
    if(++tries>4000)return null;
    if(path.length===word.length)return path;
    const ch=word[path.length];
    const cand=shuffle(nbrs(path[path.length-1])).filter(i=>!path.includes(i)&&usable(i,ch));
    cand.sort((a,b)=>(owners[a].size?1:0)-(owners[b].size?1:0));
    for(const i of cand){const r=dfs(path.concat(i));if(r)return r}
    return null;
  }
  for(const s of shuffle([...Array(N*N).keys()]).filter(i=>usable(i,word[0])).slice(0,20)){tries=0;const r=dfs([s]);if(r)return r}
  return null;
}
function wordPool(){return WORDS.filter(w=>paper==="Both"||w[3]===paper)}

let oid=0;
function qPool(){return BANK.filter(q=>paper==="Both"||q.p===paper)}
function addMcq(){
  const active=new Set(orders.map(o=>o.q));const recent=G.recentQ;
  const cands=shuffle(qPool().filter(q=>!active.has(q)&&!recent.includes(q)));
  const q=cands[0]||shuffle(qPool().filter(q=>!active.has(q)))[0];if(!q)return false;
  const id=++oid;const life=SP().mcq.life+Math.min(30,Math.round(q.stem.length/15));
  orders.push({id,q,opts:shuffle([q.right,...q.wrong]),life,left:life,cut:false});
  G.recentQ.push(q);if(G.recentQ.length>Math.max(0,qPool().length-4))G.recentQ.shift();
  if(G.cur==null){G.cur=id;drawCounter()}
  sfx.ding();return true;
}
function addOrder(){
  if(mode==="mcq")return addMcq();
  const active=new Set(orders.map(o=>o.w[0]));
  const recent=G.recent.slice(-8);
  const cands=shuffle(wordPool().filter(w=>!active.has(w[0])&&!recent.includes(w[0])));
  const fallback=shuffle(wordPool().filter(w=>!active.has(w[0])));
  for(const w of cands.concat(fallback)){
    const path=placePath(w[0]);if(!path)continue;
    const id=++oid;const fresh=[];
    path.forEach((cell,k)=>{if(grid[cell]!==w[0][k]){grid[cell]=w[0][k];fresh.push(cell)}owners[cell].add(id)});
    const life=(38+w[0].length*3.5)*SP().grid.mult;
    orders.push({id,w,path,life,left:life,peeked:false});
    G.recent.push(w[0]);
    drawGrid(fresh);sfx.ding();return true;
  }
  return false;
}
function removeOrder(o){
  orders=orders.filter(x=>x!==o);
  if(mode==="mcq"){if(G.cur===o.id){G.cur=orders[0]?orders[0].id:null;if(!G.fb)drawCounter()}G.pending.push(1.2);return}
  const freed=[];
  o.path.forEach(c=>{owners[c].delete(o.id);if(!owners[c].size)freed.push(c)});
  freed.forEach(c=>grid[c]=rnd(FILL));
  clearSel();drawGrid(freed);
  G.pending.push(1.2);
}

/* ---------- game loop ---------- */
const asItem=o=>o.q?{name:o.q.s,paper:o.q.p,clue:o.q.stem,ans:o.q.right,exp:o.q.exp}:{name:o.w[1],paper:o.w[3],clue:o.w[2]};
function start(){
  SHIFT=SP()[mode].shift;MAXORD=SP().max;$("rail").style.setProperty("--cols",MAXORD);
  grid=Array.from({length:N*N},()=>rnd(FILL));owners=Array.from({length:N*N},()=>new Set());orders=[];
  G={t:SHIFT,tips:0,combo:1,lastServe:-99,served:[],burnt:[],sent:[],pending:[],recent:[],recentQ:G?G.recentQ||[]:[],peeks:0,cur:null,fb:false};
  const mc=mode==="mcq";$("hob").hidden=$("pass").hidden=mc;$("counter").hidden=!mc;$("rail").classList.toggle("mcq",mc);$("rail").dataset.ids="";
  $("intro").hidden=$("results").hidden=true;$("game").hidden=false;
  if(!mc)drawGrid([...Array(N*N).keys()]);
  addOrder();addOrder();G.pending.push(mc?20:14);drawCounter();
  if(!mc)clearSel();updateHud();drawRail();
  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  window.scrollTo({top:0});
}
function loop(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(!document.hidden&&!G.fb){
    G.t-=dt;
    orders.slice().forEach(o=>{o.left-=dt;if(o.left<=0){G.burnt.push(asItem(o));G.tips=Math.max(0,G.tips-10);G.combo=1;sfx.burn();toast(o.q?`Table ${o.id} walked out (−£10)`:`Burnt! ${o.w[1]} went in the bin (−£10)`);removeOrder(o)}});
    G.pending=G.pending.map(x=>Math.max(0,x-dt)).sort((a,b)=>a-b);
    while(G.pending.length&&G.pending[0]<=0&&orders.length<MAXORD){G.pending.shift();if(!addOrder()){G.pending.push(1);break}}
    if(orders.length===0&&!G.pending.length)G.pending.push(.5);
    if(G.t<=0)return finish();
    updateHud();drawRail(true);
  }
  raf=requestAnimationFrame(loop);
}
function updateHud(){
  const t=Math.max(0,Math.ceil(G.t));$("clock").textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
  $("tips").textContent="£"+G.tips;$("combo").textContent="×"+G.combo;
  const s=starsFor(G.tips);[...$("hudStars").children].forEach((e,i)=>e.classList.toggle("on",i<s));
}
const TH={grid:[300,700,1200],mcq:[200,450,800]};
const starsFor=t=>{const T=TH[mode];return t>=T[2]?3:t>=T[1]?2:t>=T[0]?1:0};

/* ---------- tickets ---------- */
function drawRail(tickOnly){
  const rail=$("rail");
  if(tickOnly&&rail.children.length===MAXORD&&rail.dataset.ids===orders.map(o=>o.id).join()&&rail.dataset.cur==String(G.cur)){
    orders.forEach((o,i)=>{const el=rail.children[i];const f=o.left/o.life;el.querySelector(".bar i").style.width=(f*100)+"%";el.classList.toggle("mid",f<.5&&f>=.22);el.classList.toggle("late",f<.22)});return;
  }
  rail.innerHTML="";rail.dataset.ids=orders.map(o=>o.id).join();rail.dataset.cur=G.cur;
  for(let i=0;i<MAXORD;i++){
    const o=orders[i];const el=document.createElement("div");
    if(!o){el.className="ticket empty";el.textContent="Next order coming…";rail.append(el);continue}
    if(o.q){
      el.className="ticket"+(o.id===G.cur?" cur":"");el.tabIndex=0;el.setAttribute("role","button");
      el.innerHTML=`<div class="top"><span>Table ${o.id}</span><span>${o.q.p}</span></div><div class="clue"></div><div class="bar"><i style="width:${o.left/o.life*100}%"></i></div>`;
      el.querySelector(".clue").textContent=o.q.s;
      const pickIt=()=>{if(G.fb)return;G.cur=o.id;drawRail();drawCounter()};
      el.onclick=pickIt;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickIt()}};
      rail.append(el);continue;
    }
    el.className="ticket";
    el.innerHTML=`<div class="top"><span>Table ${o.id}</span><span>${o.w[3]}</span></div><div class="clue"></div><div class="lenrow"><span class="len">${o.w[1].replace(/[A-Za-z]/g,"_ ").trim()} (${o.w[0].length})</span><button class="peek" type="button">${o.peeked?"First letter shown":"Peek (−£5)"}</button></div><div class="bar"><i style="width:${o.left/o.life*100}%"></i></div>`;
    el.querySelector(".clue").textContent=o.w[2];
    el.querySelector(".peek").onclick=()=>{if(o.peeked)return;o.peeked=true;G.tips=Math.max(0,G.tips-5);G.peeks++;drawGrid([]);drawRail();updateHud()};
    rail.append(el);
  }
}

/* ---------- best-answer counter ---------- */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function curOrder(){return orders.find(o=>o.id===G.cur)}
function drawCounter(){
  if(mode!=="mcq")return;
  const c=$("counter"),o=curOrder();
  if(!o){c.innerHTML=`<p class="muted" style="margin:0">The next order is on its way…</p>`;return}
  c.innerHTML=`<div class="tagline">Table ${o.id} · ${o.q.p} · ${esc(o.q.s)}</div><p class="stem">${esc(o.q.stem)}</p><div class="mopts">${o.opts.map((t,k)=>`<button class="mopt" type="button" data-k="${k}"${o.cut&&o.cut.includes(k)?" disabled":""}><span class="k">${"ABCDE"[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>${o.cut?"":`<button class="lifeline" type="button" id="lifeBtn">Ask the head chef: remove two wrong answers (−£5)</button>`}`;
  c.querySelectorAll(".mopt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  const lb=$("lifeBtn");if(lb)lb.onclick=()=>{const wrongs=shuffle(o.opts.map((t,k)=>k).filter(k=>o.opts[k]!==o.q.right)).slice(0,2);o.cut=wrongs;G.tips=Math.max(0,G.tips-5);G.peeks++;updateHud();drawCounter()};
}
function choose(k){
  const o=curOrder();if(!o||G.fb)return;
  if(o.cut&&o.cut.includes(k))return;
  const ri=o.opts.indexOf(o.q.right);
  if(k===ri){
    const now=SHIFT-G.t;
    G.combo=now-G.lastServe<SP().mcq.life/2?Math.min(G.combo+1,4):1;G.lastServe=now;
    const tip=(20+Math.round(30*o.left/o.life))*G.combo;
    G.tips+=tip;G.served.push(asItem(o));sfx.serve();
    toast(`Served to table ${o.id}! +£${tip}${G.combo>1?` (combo ×${G.combo})`:""}`);
    removeOrder(o);drawRail();updateHud();return;
  }
  G.tips=Math.max(0,G.tips-10);G.combo=1;sfx.bad();
  G.sent.push({...asItem(o),yours:o.opts[k]});
  G.fb=true;
  const c=$("counter");
  c.querySelectorAll(".mopt").forEach((b,j)=>{b.disabled=true;if(j===ri)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  const lb=$("lifeBtn");if(lb)lb.remove();
  const fb=document.createElement("div");fb.className="fb";
  fb.innerHTML=`<h3>Sent back! (−£10)</h3><p><b>Best answer:</b> ${esc(o.q.right)}</p>${o.q.exp?`<p class="muted">${esc(o.q.exp)}</p>`:""}<div class="row" style="margin-top:6px"><button class="btn small" type="button" id="fbNext">Back to the kitchen</button></div><p class="muted" style="font-size:13px">The clock is paused while you read.</p>`;
  c.append(fb);$("fbNext").onclick=closeFb;$("fbNext").focus({preventScroll:true});
  removeOrder(o);updateHud();
}
function closeFb(){G.fb=false;last=performance.now();drawRail();drawCounter();window.scrollTo({top:0,behavior:"smooth"})}

/* ---------- grid view + input ---------- */
let sel=[], dragging=false, moved=false;
function drawGrid(fresh){
  const g=$("grid");
  if(g.children.length!==N*N){g.innerHTML="";for(let i=0;i<N*N;i++){const b=document.createElement("button");b.type="button";b.className="cell";b.dataset.i=i;g.append(b)}}
  const hints=new Set(orders.filter(o=>o.peeked).map(o=>o.path[0]));
  [...g.children].forEach((b,i)=>{b.textContent=grid[i];b.setAttribute("aria-label","Letter "+grid[i]);b.classList.toggle("hint",hints.has(i));if(fresh.includes(i)){b.classList.remove("fresh");void b.offsetWidth;b.classList.add("fresh")}});
  paintSel();
}
function paintSel(){
  const g=$("grid");[...g.children].forEach((b,i)=>{b.classList.toggle("sel",sel.includes(i));b.classList.toggle("last",sel[sel.length-1]===i)});
  $("word").textContent=sel.map(i=>grid[i]).join("");
  const svg=$("trail"),hob=$("hob").getBoundingClientRect(),sb=svg.getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${sb.width} ${sb.height}`);
  const pts=sel.map(i=>{const r=g.children[i].getBoundingClientRect();return [(r.left+r.width/2-sb.left).toFixed(1),(r.top+r.height/2-sb.top).toFixed(1)].join(",")});
  svg.innerHTML=pts.length>1?`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--sel)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>`:"";
}
function clearSel(){sel=[];paintSel()}
function cellAt(x,y,strict){
  const g=$("grid");
  for(const b of g.children){const r=b.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const d=Math.hypot(x-cx,y-cy);if(d<(strict?r.width*.42:r.width*.55))return +b.dataset.i}
  return -1;
}
function extend(i){
  if(i<0)return false;
  const L=sel.length;
  if(L>1&&sel[L-2]===i){sel.pop();paintSel();return true}
  if(sel.includes(i))return false;
  if(L===0||adj(sel[L-1],i)){sel.push(i);sfx.tap(sel.length);paintSel();return true}
  return false;
}
const hob=$("hob");
hob.addEventListener("pointerdown",e=>{
  const i=cellAt(e.clientX,e.clientY,false);if(i<0)return;
  e.preventDefault();
  if(sel.length&&sel[sel.length-1]===i&&sel.length>1){serve();return}
  if(sel.length&&!adj(sel[sel.length-1],i)&&!sel.includes(i)){sel=[]}
  if(sel.includes(i)&&sel[sel.length-1]!==i){sel=sel.slice(0,sel.indexOf(i)+1);paintSel()}
  else extend(i);
  dragging=true;moved=false;try{hob.setPointerCapture(e.pointerId)}catch(_){}
});
hob.addEventListener("pointermove",e=>{if(!dragging)return;const i=cellAt(e.clientX,e.clientY,true);if(i>=0&&i!==sel[sel.length-1]){if(extend(i))moved=true}});
const up=()=>{if(!dragging)return;dragging=false;if(moved&&sel.length>1)serve()};
hob.addEventListener("pointerup",up);hob.addEventListener("pointercancel",up);
window.addEventListener("resize",()=>{if(!$("game").hidden)paintSel()});

function serve(){
  const w=sel.map(i=>grid[i]).join("");
  if(w.length<2){clearSel();return}
  const o=orders.find(o=>o.w[0]===w);
  if(!o){const el=$("word");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");sfx.bad();toast(wordPool().some(x=>x[0]===w)?"Nobody ordered that one right now":"That's not on any ticket");setTimeout(clearSel,350);return}
  const now=SHIFT-G.t;
  G.combo=now-G.lastServe<10*SP().grid.mult?Math.min(G.combo+1,4):1;G.lastServe=now;
  const speed=Math.round(20*o.left/o.life);
  const tip=(10+w.length*5+speed)*G.combo;
  G.tips+=tip;G.served.push(o.w);sfx.serve();
  toast(`${o.w[1]} served! +£${tip}${G.combo>1?` (combo ×${G.combo})`:""}`);
  removeOrder(o);drawRail();updateHud();
}
$("serveBtn").onclick=serve;$("binBtn").onclick=clearSel;
$("endBtn").onclick=()=>finish();
document.addEventListener("keydown",e=>{
  if($("game").hidden)return;
  if(mode==="mcq"){
    if(G.fb){if(e.key==="Enter"&&document.activeElement!==$("fbNext"))closeFb();return}
    const k="abcde".indexOf(e.key.toLowerCase()),n="12345".indexOf(e.key);const i=k>=0?k:n;
    if(i>=0)choose(i);return;
  }
  if(e.key==="Enter")serve();if(e.key==="Escape"||e.key==="Backspace")clearSel()});

let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1500)}

/* ---------- results ---------- */
function finish(){
  cancelAnimationFrame(raf);
  $("game").hidden=true;$("results").hidden=false;
  const s=starsFor(G.tips);[...$("resStars").children].forEach((e,i)=>e.classList.toggle("on",i<s));
  $("resHead").textContent=["Kitchen nightmare!","Service!","Busy night, well run!","Michelin-starred counsel!"][s];
  $("resLine").textContent=`£${G.tips} in tips · ${G.served.length} served · ${mode==="mcq"?`${G.sent.length} sent back · `:""}${G.burnt.length} burnt`;
  const best=store.get(bestKey(),0);
  if(G.tips>best){store.set(bestKey(),G.tips);$("resSub").textContent="New best shift! Angelica runs this kitchen."}
  else $("resSub").textContent=`Best shift: £${best}. ${s<3?"Go again for the next star.":"Three stars. Exam-ready chef!"}`;
  const m=$("menu");m.innerHTML="";
  const seen=new Set();
  $("menuHead").textContent=mode==="mcq"?"Questions to go over (sent back and burnt first)":"Tonight's menu (revise these)";
  const list=mode==="mcq"?G.sent.map(x=>[x,1]).concat(G.burnt.map(x=>[x,1]),G.served.map(x=>[x,0])):G.served.map(x=>[x,0]).concat(G.burnt.map(x=>[x,1]));
  list.forEach(([x,b])=>{const key=x.clue+b;if(seen.has(key))return;seen.add(key);const d=document.createElement("div");if(b&&!x.ans)d.className="burnt";
    d.innerHTML=`<b>${esc(x.name)}</b> <span class="muted">${esc(x.paper)}${x.ans?(x.yours?" · sent back":b?" · burnt":" · served"):""}</span><br><span>${esc(x.clue)}</span>${x.yours?`<br><span class="yours">You said: ${esc(x.yours)}</span>`:""}${x.ans&&b?`<br><span class="ans">Best answer: ${esc(x.ans)}</span>${x.exp?`<br><span class="muted">${esc(x.exp)}</span>`:""}`:""}`;
    m.append(d)});
  if(!m.children.length)m.innerHTML=`<div class="muted">No dishes this shift. Have another go!</div>`;
  window.scrollTo({top:0});
}
$("startBtn").onclick=start;$("againBtn").onclick=start;
$("homeBtn").onclick=()=>{$("results").hidden=true;$("intro").hidden=false;renderIntro()};
renderIntro();
</script>
